{% extends "base.html" %}
{% block title %}Ingresar — IPM Manager v2{% endblock %}

{% block content %}
<div class="card" style="max-width:340px;margin:3rem auto 0">
  <h2 style="font-size:1.2rem">IPM Manager <span style="color:var(--ember)">v2</span></h2>
  <p class="muted" style="margin:.3rem 0 1rem">Mantenimiento de sistemas contra incendio</p>

  <form method="post" style="display:grid;gap:.6rem">
    <label class="tiny" for="username">Usuario</label>
    <input id="username" name="username" autocomplete="username" required
           style="border:1px solid var(--border);border-radius:var(--r-sm);padding:.45rem .55rem;font:inherit">
    <label class="tiny" for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required
           style="border:1px solid var(--border);border-radius:var(--r-sm);padding:.45rem .55rem;font:inherit">
    <button class="btn" type="submit" style="justify-content:center;margin-top:.3rem">Ingresar</button>
  </form>

  <p class="tiny" style="margin-top:1rem">
    Demo: <span class="mono">jefe / jefe</span> (aprueba solo) ·
    <span class="mono">tecnico / tecnico</span> (queda pendiente)
  </p>
</div>
{% endblock %}
